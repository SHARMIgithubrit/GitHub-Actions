name: Basic CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Workflow level
env:
  APP_NAME: my-first-app

jobs:
  build:
    runs-on: ubuntu-latest

    # Job level
    env:
      JOB_VAR: build-job-value

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Call workflow-level and job-level variables
      - name: Show workflow and job variables
        run: |
          echo "Workflow variable: $APP_NAME"
          echo "Job variable: $JOB_VAR"

      # Step level: declared and called in the same step
      - name: Show step variable
        env:
          STEP_VAR: step-only-value
        run: |
          echo "Workflow variable: $APP_NAME"
          echo "Job variable: $JOB_VAR"
          echo "Step variable: $STEP_VAR"

      # STEP_VAR is not available here
      - name: Step variable is gone
        run: |
          echo "Step variable: [$STEP_VAR]"