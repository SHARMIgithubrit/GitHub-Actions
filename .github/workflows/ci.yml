name: Basic CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Workflow level: uses GitHub variable and secret
env:
  APP_NAME: my-first-app
  APP_VERSION: ${{ vars.APP_VERSION }}
  MY_SECRET: ${{ secrets.MY_SECRET }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Show GitHub variable
        run: |
          echo "App name: $APP_NAME"
          echo "App version: $APP_VERSION"

      - name: Show GitHub secret
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "Secret is NOT set"
          else
            echo "Secret is set"
          fi
          echo "Secret value: $MY_SECRET"
